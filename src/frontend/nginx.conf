server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolve service names per request so one slow
    # service cannot stop the frontend from starting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Same-origin API prefixes, one per service. The service name is the
    # compose DNS name; no service publishes a host port.
    location /api/content/ {
        set $content_upstream content;
        rewrite ^/api/content/(.*)$ /api/$1 break;
        proxy_pass http://$content_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/progress/ {
        set $progress_upstream progress;
        rewrite ^/api/progress/(.*)$ /api/$1 break;
        proxy_pass http://$progress_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/roster/ {
        set $roster_upstream roster;
        rewrite ^/api/roster/(.*)$ /api/$1 break;
        proxy_pass http://$roster_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/requirements/ {
        set $requirements_upstream requirements;
        rewrite ^/api/requirements/(.*)$ /api/$1 break;
        proxy_pass http://$requirements_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location /api/recommendations/ {
        set $recommendations_upstream recommendations;
        rewrite ^/api/recommendations/(.*)$ /api/$1 break;
        proxy_pass http://$recommendations_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
